# Lint only. This project does not auto-format: the report layout, the
# specimens' XML and the docstrings are placed deliberately, and `ruff format`
# would rewrite a dozen files nobody asked it to. CI runs the same check.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # `if False:` is how a watched failure gets parked while the test that proves
  # it is written, and ruff's selected rules (E, F, I, UP, B) do not flag it.
  # One such guard reached the working tree in `jpeg.py` and disabled the
  # start-of-scan check, so `dimensions()` read a frame header out of
  # compressed data. The test caught it; nothing else would have.
  - repo: local
    hooks:
      - id: no-parked-guards
        name: no `if False:` left in src/
        entry: 'if False:'
        language: pygrep
        files: ^src/.*\.py$
