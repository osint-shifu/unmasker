name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # `ruff check`, not `ruff format --check`. This project lints and does
      # not auto-format: the layout of the report, the specimens' XML and the
      # docstrings are placed deliberately, and a formatter run at publication
      # time would rewrite twelve files nobody asked it to. CI asserts the
      # standard the project actually holds, which is the one in README.md.
      - name: Ruff
        run: ruff check .
      # The specimens are the test suite here and they are committed, so this
      # runs the real thing on every platform. Nothing renders or shells out:
      # `--ocr` needs ghostscript and tesseract and is not exercised in CI,
      # which `tests/test_ocr.py` skips for rather than failing over.
      - name: Tests
        run: pytest
