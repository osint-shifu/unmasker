name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # One test shells out to poppler, and it is the one that proves this tool
      # says something the obvious answer does not: `pdftotext` reports no
      # annotations, so a comment carrying "Do not minute this" is invisible to
      # the first thing anybody reaches for. It skips where poppler is absent,
      # so installing it on one platform is the difference between that claim
      # being checked somewhere and checked nowhere.
      - name: Poppler (for the one test that needs it)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # `ruff check`, not `ruff format --check`. This project lints and does
      # not auto-format: the layout of the report, the specimens' XML and the
      # docstrings are placed deliberately, and a formatter run at publication
      # time would rewrite twelve files nobody asked it to. CI asserts the
      # standard the project actually holds, which is the one in README.md.
      - name: Ruff
        run: ruff check .
      # The specimens are the test suite here and they are committed, so this
      # runs the real thing on every platform. `--ocr` is not exercised: it
      # needs ghostscript and tesseract, and `tests/test_ocr.py` skips rather
      # than failing over their absence. Every test that shells out is guarded
      # the same way - the first CI run failed because one of them was not, and
      # nothing on this machine could have told us.
      - name: Tests
        run: pytest

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  package:
    runs-on: ubuntu-latest

    # The tests above run from a checkout, so they prove nothing about the
    # artifact people actually install. A wheel that cannot be built, or that
    # is missing a file, fails only for them and only after publication.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: The typing marker has to be inside the wheel
        run: |
          python - <<'CHECK'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "unmasker/py.typed" in names, names
          CHECK
      # Installing it and running it is the part that catches an import which
      # type-checks and does not exist at runtime. Mypy passing is not the
      # program running.
      - name: Install what was built and run it
        run: |
          python -m pip install dist/*.whl
          unmasker --version
